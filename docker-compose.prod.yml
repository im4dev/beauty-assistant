# Producción en el EC2 compartido con OctoOps: reutiliza el Postgres y el
# Caddy de OctoOps (red octoops_default) para no duplicar contenedores en
# una máquina de 1 GB. Caddy enruta beauty.apeiriumx.com -> beauty-assistant:8000.
services:
  app:
    image: beauty-assistant:latest
    container_name: beauty-assistant
    env_file:
      - .env
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - octoops

networks:
  octoops:
    external: true
    name: octoops_default
